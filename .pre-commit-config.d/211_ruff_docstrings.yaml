---
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.3
  hooks:
    - id: ruff-check
      name: ruff-docstrings
      args:
        - --fix
        - --config
        - |
          lint.select = ["D"]
          lint.pydocstyle.convention = "google"
          lint.ignore = ["D107"]
      exclude: (^|/)(tests?|testing)/|\.ipynb$
